<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<title>পান্ডু — তোমার AI বন্ধু</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#10b981;--brand-dark:#059669;--brand-light:#34d399;
  --bamboo:#65a30d;--bamboo-dark:#4d7c0f;
  --bg:#0a1810;--bg-alt:#0f1f16;--surface:#16291c;--surface-hover:#1e3826;
  --text:#f0fdf4;--text-secondary:#86efac;--text-muted:#4ade80;
  --border:#1e3a2a;--border-light:#2a4a35;
  --danger:#ef4444;
  --shadow-brand:0 10px 40px -10px rgba(16,185,129,.4);
  --font-bn:'Hind Siliguri',system-ui,sans-serif;
  --font-en:'Plus Jakarta Sans',system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#f0fdf4;--bg-alt:#dcfce7;--surface:#ffffff;--surface-hover:#f0fdf4;
  --text:#052e16;--text-secondary:#166534;--text-muted:#15803d;
  --border:#bbf7d0;--border-light:#dcfce7;
}
html,body{height:100%}
body{
  font-family:var(--font-bn);background:var(--bg);color:var(--text);
  line-height:1.5;overflow:hidden;transition:background .4s,color .4s;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ============================================================
   SPLASH
   ============================================================ */
#splash{
  position:fixed;inset:0;z-index:99999;
  background:linear-gradient(160deg,#0a1810 0%,#0f2818 50%,#051008 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s;
}
#splash.hide{opacity:0;pointer-events:none}
.splash-panda{font-size:130px;animation:pandaDance 1.4s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(16,185,129,.5));margin-bottom:16px}
@keyframes pandaDance{
  0%,100%{transform:translateY(0) rotate(-4deg) scale(1)}
  25%{transform:translateY(-14px) rotate(5deg) scale(1.06)}
  50%{transform:translateY(-4px) rotate(-2deg) scale(.98)}
  75%{transform:translateY(-10px) rotate(3deg) scale(1.04)}
}
.splash-title{
  font-family:var(--font-en);font-size:clamp(36px,10vw,52px);font-weight:800;
  background:linear-gradient(135deg,#34d399 0%,#10b981 50%,#65a30d 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-1px;margin-bottom:8px;
}
.splash-sub{color:#86efac;font-size:14px;letter-spacing:3px;text-transform:uppercase;opacity:.8;margin-bottom:40px}
.splash-bar{width:200px;height:5px;background:rgba(134,239,172,.15);border-radius:99px;overflow:hidden}
.splash-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#10b981,#34d399,#65a30d);border-radius:99px;animation:barFill 2.2s .2s forwards}
@keyframes barFill{to{width:100%}}
.splash-status{margin-top:14px;font-size:12px;color:#4ade80;font-weight:600;letter-spacing:.5px}

/* ============================================================
   MAIN APP
   ============================================================ */
#app{
  position:fixed;inset:0;display:none;flex-direction:column;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(16,185,129,.15),transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%,rgba(101,163,13,.1),transparent 70%),
    var(--bg);
  overflow:hidden;
}
#app.active{display:flex}

/* বাঁশের ঝাড় ব্যাকগ্রাউন্ড */
.bamboo-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.08}
.bamboo-bg::before,.bamboo-bg::after{
  content:'';position:absolute;width:100%;height:100%;
  background:
    repeating-linear-gradient(90deg,transparent 0,transparent 80px,var(--bamboo) 80px,var(--bamboo) 84px,transparent 84px,transparent 200px);
}

/* ============================================================
   TOP BAR
   ============================================================ */
.top-bar{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;flex-shrink:0;
}
.back-btn{
  width:42px;height:42px;border-radius:12px;
  background:rgba(16,185,129,.15);border:1.5px solid rgba(16,185,129,.3);
  color:var(--brand-light);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.back-btn:hover{background:rgba(16,185,129,.25)}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:9999px;
  background:rgba(16,185,129,.15);border:1.5px solid rgba(16,185,129,.3);
  font-family:var(--font-en);font-size:12px;font-weight:700;color:var(--brand-light);
}
.status-pill .dot{
  width:8px;height:8px;border-radius:50%;background:var(--brand);
  box-shadow:0 0 10px var(--brand-light);
  animation:dotPulse 2s infinite;
}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ============================================================
   CALL SCREEN — মাঝখানে পান্ডা
   ============================================================ */
.call-screen{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;z-index:10;padding:20px;
}

/* পান্ডার চারপাশে রিং (শুনছে/বলছে বোঝাতে) */
.panda-ring{
  position:relative;width:260px;height:260px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;
}
.panda-ring::before,
.panda-ring::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(16,185,129,.2);
  animation:ringExpand 3s ease-out infinite;
}
.panda-ring::after{animation-delay:1.5s}
@keyframes ringExpand{
  0%{transform:scale(.8);opacity:.6}
  100%{transform:scale(1.4);opacity:0}
}

/* পান্ডার অ্যানিমেশন ওয়াপার */
.panda-avatar{
  width:200px;height:200px;border-radius:50%;
  background:linear-gradient(135deg,rgba(16,185,129,.3),rgba(101,163,13,.2));
  border:4px solid rgba(16,185,129,.4);
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:2;
  transition:all .4s;
  box-shadow:0 0 60px rgba(16,185,129,.3);
}
.panda-emoji{
  font-size:110px;line-height:1;
  transition:transform .3s;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));
}

/* পান্ডার অবস্থা অনুযায়ী অ্যানিমেশন */
.panda-avatar.state-idle .panda-emoji{
  animation:pandaIdle 3s ease-in-out infinite;
}
@keyframes pandaIdle{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-6px) rotate(2deg)}
}

.panda-avatar.state-listening{
  border-color:rgba(239,68,68,.6);
  box-shadow:0 0 80px rgba(239,68,68,.5);
}
.panda-avatar.state-listening .panda-emoji{
  animation:pandaListen .8s ease-in-out infinite;
}
@keyframes pandaListen{
  0%,100%{transform:scale(1) rotate(-3deg)}
  50%{transform:scale(1.1) rotate(3deg)}
}

.panda-avatar.state-thinking{
  border-color:rgba(251,191,36,.6);
  box-shadow:0 0 80px rgba(251,191,36,.5);
}
.panda-avatar.state-thinking .panda-emoji{
  animation:pandaThink 1.5s ease-in-out infinite;
}
@keyframes pandaThink{
  0%,100%{transform:rotate(0deg)}
  25%{transform:rotate(-8deg)}
  75%{transform:rotate(8deg)}
}

.panda-avatar.state-speaking{
  border-color:rgba(16,185,129,.8);
  box-shadow:0 0 100px rgba(16,185,129,.6);
}
.panda-avatar.state-speaking .panda-emoji{
  animation:pandaSpeak .4s ease-in-out infinite;
}
@keyframes pandaSpeak{
  0%,100%{transform:scale(1) translateY(0)}
  50%{transform:scale(1.08) translateY(-3px)}
}

/* পান্ডার নাম */
.panda-name{
  font-family:var(--font-en);font-size:28px;font-weight:800;
  color:var(--text);letter-spacing:-.5px;margin-bottom:4px;
}
.panda-role{
  font-size:13px;color:var(--text-secondary);margin-bottom:24px;
  font-weight:500;
}

/* অবস্থা দেখানোর টেক্সট (লেখা দেখা যাবে না — শুধু ইমোজি/সাউন্ড) */
.panda-state-icon{
  font-size:24px;color:var(--brand-light);height:28px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;
}

/* কল টাইমার */
.call-timer{
  font-family:var(--font-en);font-size:20px;font-weight:700;
  color:var(--text-secondary);letter-spacing:2px;
  font-variant-numeric:tabular-nums;
}

/* ভিজ্যুয়ালাইজার (কথা বলার সময় ওয়েভ) */
.visualizer{
  display:flex;align-items:center;justify-content:center;
  gap:4px;height:40px;margin-top:20px;
}
.visualizer span{
  width:4px;height:8px;background:var(--brand-light);border-radius:2px;
  transition:height .1s;
}
.visualizer.active span{
  animation:wave 1s ease-in-out infinite;
}
.visualizer span:nth-child(1){animation-delay:0s}
.visualizer span:nth-child(2){animation-delay:.1s}
.visualizer span:nth-child(3){animation-delay:.2s}
.visualizer span:nth-child(4){animation-delay:.3s}
.visualizer span:nth-child(5){animation-delay:.4s}
.visualizer span:nth-child(6){animation-delay:.5s}
.visualizer span:nth-child(7){animation-delay:.6s}
@keyframes wave{
  0%,100%{height:8px;opacity:.5}
  50%{height:36px;opacity:1}
}

/* ============================================================
   CALL CONTROLS — নিচে বাটন
   ============================================================ */
.call-controls{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:center;
  gap:20px;padding:20px 20px 40px;
  flex-shrink:0;
}
.ctrl-btn{
  width:64px;height:64px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;
  transition:all .2s;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  position:relative;
}
.ctrl-btn:active{transform:scale(.92)}
.ctrl-btn.mic{
  background:linear-gradient(135deg,#10b981,#059669);
  box-shadow:0 6px 20px rgba(16,185,129,.4);
}
.ctrl-btn.mic.active{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  box-shadow:0 6px 25px rgba(239,68,68,.6);
  animation:micPulse 1.2s infinite;
}
@keyframes micPulse{
  0%,100%{box-shadow:0 6px 25px rgba(239,68,68,.6),0 0 0 0 rgba(239,68,68,.5)}
  50%{box-shadow:0 6px 25px rgba(239,68,68,.6),0 0 0 20px rgba(239,68,68,0)}
}
.ctrl-btn.speaker{
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  box-shadow:0 6px 20px rgba(59,130,246,.4);
}
.ctrl-btn.speaker.muted{
  background:linear-gradient(135deg,#64748b,#334155);
}
.ctrl-btn.end{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  box-shadow:0 6px 20px rgba(239,68,68,.4);
  width:72px;height:72px;font-size:26px;
}

/* ============================================================
   HOME SCREEN (কল শুরুর আগে)
   ============================================================ */
.home-screen{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;position:relative;z-index:10;text-align:center;
}
.home-panda{
  font-size:140px;line-height:1;margin-bottom:20px;
  animation:pandaIdle 3s ease-in-out infinite;
  filter:drop-shadow(0 8px 24px rgba(16,185,129,.4));
}
.home-title{
  font-family:var(--font-en);font-size:32px;font-weight:800;
  color:var(--text);margin-bottom:8px;letter-spacing:-.5px;
}
.home-sub{
  font-size:15px;color:var(--text-secondary);
  max-width:300px;margin-bottom:32px;line-height:1.6;
}
.call-btn{
  padding:18px 40px;border-radius:20px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;font-family:var(--font-en);font-weight:800;font-size:17px;
  display:inline-flex;align-items:center;gap:12px;
  box-shadow:0 8px 24px rgba(16,185,129,.5);
  transition:all .2s;
  animation:callBtnPulse 2s infinite;
}
@keyframes callBtnPulse{
  0%,100%{box-shadow:0 8px 24px rgba(16,185,129,.5),0 0 0 0 rgba(16,185,129,.4)}
  50%{box-shadow:0 8px 24px rgba(16,185,129,.5),0 0 0 18px rgba(16,185,129,0)}
}
.call-btn:active{transform:scale(.96)}

/* ============================================================
   NOTIFICATION / TOAST
   ============================================================ */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);
  background:var(--surface);border:2px solid var(--brand);
  padding:12px 22px;border-radius:14px;
  font-size:13px;font-weight:700;color:var(--text);
  z-index:1000;transition:transform .4s cubic-bezier(.5,1.5,.7,1);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  max-width:90vw;text-align:center;line-height:1.5;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.warning{border-color:#f59e0b}
.toast.error{border-color:#ef4444}

/* ============================================================
   VOICE PERMISSION MODAL
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:500;display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--surface);border:2px solid var(--border);
  border-radius:22px;padding:26px;max-width:380px;width:100%;
  animation:popIn .35s cubic-bezier(.5,1.5,.7,1);
  text-align:center;
}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{font-size:52px;margin-bottom:14px}
.modal-title{
  font-family:var(--font-en);font-size:20px;font-weight:800;
  color:var(--text);margin-bottom:10px;
}
.modal-text{
  font-size:14px;color:var(--text-secondary);
  line-height:1.6;margin-bottom:22px;
}
.modal-btn{
  width:100%;padding:14px;border-radius:14px;
  font-family:var(--font-en);font-weight:800;font-size:15px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;box-shadow:0 4px 0 #047857;
  transition:all .15s;
}
.modal-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #047857}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-height:640px){
  .panda-ring{width:200px;height:200px}
  .panda-avatar{width:160px;height:160px}
  .panda-emoji{font-size:85px}
  .call-controls{padding:12px 20px 24px}
  .ctrl-btn{width:56px;height:56px;font-size:20px}
  .ctrl-btn.end{width:64px;height:64px}
}
@media(max-width:380px){
  .panda-ring{width:220px;height:220px}
  .panda-avatar{width:170px;height:170px}
  .panda-emoji{font-size:90px}
}
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash">
  <div class="splash-panda">🐼</div>
  <div class="splash-title">Pandu</div>
  <div class="splash-sub">তোমার AI বন্ধু</div>
  <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  <div class="splash-status">প্রস্তুত হচ্ছে...</div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="bamboo-bg"></div>
  
  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()" id="backBtn" style="visibility:hidden">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="status-pill">
      <span class="dot"></span>
      <span id="statusText">অনলাইন</span>
    </div>
  </div>
  
  <!-- HOME SCREEN -->
  <div class="home-screen" id="homeScreen">
    <div class="home-panda">🐼</div>
    <div class="home-title">হ্যালো!</div>
    <div class="home-sub">আমি পান্ডু, তোমার AI বন্ধু। কল দিয়ে আমার সাথে কথা বলো!</div>
    <button class="call-btn" onclick="startCall()">
      <i class="fas fa-phone"></i>
      পান্ডুকে কল দাও
    </button>
  </div>
  
  <!-- CALL SCREEN -->
  <div class="call-screen" id="callScreen" style="display:none">
    <div class="panda-ring">
      <div class="panda-avatar state-idle" id="pandaAvatar">
        <div class="panda-emoji" id="pandaEmoji">🐼</div>
      </div>
    </div>
    <div class="panda-name">পান্ডু</div>
    <div class="panda-role">তোমার AI বন্ধু</div>
    <div class="panda-state-icon" id="stateIcon">💤</div>
    <div class="call-timer" id="callTimer">০০:০০</div>
    <div class="visualizer" id="visualizer">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </div>
  
  <!-- CALL CONTROLS -->
  <div class="call-controls" id="callControls" style="display:none">
    <button class="ctrl-btn speaker" id="speakerBtn" onclick="toggleSpeaker()">
      <i class="fas fa-volume-up" id="speakerIcon"></i>
    </button>
    <button class="ctrl-btn mic" id="micBtn" onclick="toggleMic()">
      <i class="fas fa-microphone" id="micIcon"></i>
    </button>
    <button class="ctrl-btn end" onclick="endCall()">
      <i class="fas fa-phone-slash"></i>
    </button>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon">🎤</div>
    <div class="modal-title" id="modalTitle">মাইক্রোফোন দরকার</div>
    <div class="modal-text" id="modalText">পান্ডুর সাথে কথা বলতে মাইক্রোফোন চালু করতে হবে।</div>
    <button class="modal-btn" onclick="closeModal()" id="modalBtn">বুঝেছি</button>
  </div>
</div>

<script>
'use strict';

/* ============================================================
   ⚠️ আপনার Cloudflare Worker URL
   ============================================================ */
var WORKER_URL = 'https://lingo-ai.akijelectronic.workers.dev';
// ⚠️ উপরে আপনার Cloudflare Worker-এর আসল URL বসাবেন

/* ============================================================
   পান্ডুর ব্যক্তিত্ব (AI System Prompt)
   ============================================================ */
var PANDU_SYSTEM = 
  'তুমি "পান্ডু" — একজন উষ্ণ, স্নেহময়, মজার AI বন্ধু, বাংলাদেশী ব্যবহারকারীর সাথে বাংলায় কথা বলো। ' +
  'তুমি একজন সত্যিকারের বন্ধুর মতো আচরণ করবে — মজা করবে, গল্প করবে, মন খারাপ হলে সান্ত্বনা দেবে, আনন্দ হলে খুশি হবে। ' +
  'তোমার কথা হবে সহজ, প্রাণবন্ত, ঘরোয়া ভাষায়। কখনো রোবোটিক বা অফিসিয়াল শোনাবে না। ' +
  'ছোট ছোট বাক্যে কথা বলবে — সবচেয়ে বেশি ২-৩ বাক্য, কারণ এটা ফোন কল। ' +

/* ============================================================
   ভয়েস সিস্টেম — ৩ স্তরের বাংলা ফলব্যাক
   ============================================================ */
var BANGLA_VOICE = null;
var VOICE_READY = false;
var VOICES_LOADED = false;

// ভয়েস লিস্ট লোড
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  if(voices.length === 0) return;
  
  VOICES_LOADED = true;
  
  // বাংলা ভয়েস খুঁজি
  var bnPriority = ['bn-BD', 'bn-IN', 'bn'];
  for(var i = 0; i < bnPriority.length; i++){
    for(var j = 0; j < voices.length; j++){
      var v = voices[j];
      if(v.lang === bnPriority[i] || v.lang.indexOf('bn') === 0){
        BANGLA_VOICE = v;
        console.log('✅ বাংলা ভয়েস পাওয়া গেছে:', v.name, v.lang);
        return;
      }
    }
  }
  
  // বাংলা ভয়েস নেই
  console.log('⚠️ ব্রাউজারে বাংলা ভয়েস নেই — Google TTS ফলব্যাক ব্যবহার হবে');
  BANGLA_VOICE = null;
}

if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  // কিছু ব্রাউজারে تأخيرে আসে
  setTimeout(loadVoices, 500);
  setTimeout(loadVoices, 1500);
}

/* ============================================================
   বাংলা ভয়েস — ৩ স্তরের সিস্টেম
   ============================================================ */
function speakBangla(text, onEnd){
  if(!text || !text.trim()){ if(onEnd) onEnd(); return; }
  
  // মার্কডাউন সরাও
  var clean = String(text)
    .replace(/[*_`#]/g, '')
    .replace(/\([^)]*\)/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  
  // পান্ডু কথা বলছে — স্টেট
  setPandaState('speaking');
  
  // স্ট্র্যাটেজি ১: ব্রাউজার বাংলা ভয়েস
  if(BANGLA_VOICE){
    tryBrowserVoice(clean, onEnd);
    return;
  }
  
  // স্ট্র্যাটেজি ২: Google Translate TTS (ফ্রি)
  tryGoogleTTS(clean, onEnd);
}

function tryBrowserVoice(text, onEnd){
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.voice = BANGLA_VOICE;
    u.lang = BANGLA_VOICE.lang;
    u.rate = 0.95;
    u.pitch = 1.15;
    u.volume = 1;
    
    var finished = false;
    var finish = function(){
      if(finished) return;
      finished = true;
      if(onEnd) onEnd();
    };
    
    u.onend = finish;
    u.onerror = function(){ 
      // ব্রাউজার ভয়েস ফেইল — Google TTS ট্রাই
      tryGoogleTTS(text, onEnd);
    };
    
    // টাইমআউট প্রোটেকশন
    setTimeout(finish, Math.max(6000, text.length * 250));
    
    window.speechSynthesis.speak(u);
  }catch(e){
    tryGoogleTTS(text, onEnd);
  }
}

function tryGoogleTTS(text, onEnd){
  // Google Translate TTS — সম্পূর্ণ ফ্রি, বাংলা সাপোর্ট করে
  // ২০০ অক্ষর সীমা — ভাগ করে পাঠাই
  var chunks = splitText(text, 180);
  var idx = 0;
  
  function playNext(){
    if(idx >= chunks.length){
      if(onEnd) onEnd();
      return;
    }
    var chunk = chunks[idx++];
    var url = 'https://translate.google.com/translate_tts?ie=UTF-8&q=' + 
      encodeURIComponent(chunk) + 
      '&tl=bn&client=tw-ob&ttsspeed=0.9';
    
    var audio = new Audio(url);
    audio.crossOrigin = 'anonymous';
    
    var finished = false;
    var finish = function(){
      if(finished) return;
      finished = true;
      playNext();
    };
    
    audio.onended = finish;
    audio.onerror = function(){
      // Google TTS ব্যর্থ — হাগিং ফেস ফলব্যাক
      tryHuggingFaceTTS(chunk).then(function(blob){
        if(blob){
          var a2 = new Audio(URL.createObjectURL(blob));
          a2.onended = finish;
          a2.onerror = finish;
          a2.play().catch(finish);
        } else {
          finish();
        }
      }).catch(finish);
    };
    
    // টাইমআউট প্রোটেকশন
    setTimeout(finish, Math.max(4000, chunk.length * 200));
    
    audio.play().catch(function(){ finish(); });
  }
  
  playNext();
}

function tryHuggingFaceTTS(text){
  // Hugging Face ফ্রি বাংলা TTS
  var url = 'https://facebook-mms-tts-ben.hf.space/api/predict';
  // এন্ডপয়েন্ট সাধারণত বদলায় — যদি এটা না হয়, নিচের ফাংশন skip করবে
  return Promise.reject(new Error('HF TTS not available'));
}

// লম্বা টেক্সট ভাগ করো
function splitText(text, maxLen){
  if(text.length <= maxLen) return [text];
  var parts = [];
  var sentences = text.split(/(?<=[।.!?])\s+/);
  var current = '';
  
  sentences.forEach(function(s){
    if((current + ' ' + s).length > maxLen){
      if(current) parts.push(current.trim());
      current = s;
    } else {
      current += ' ' + s;
    }
  });
  if(current) parts.push(current.trim());
  return parts.filter(function(p){ return p.length > 0; });
}

/* ============================================================
   পান্ডার স্টেট পরিবর্তন
   ============================================================ */
function setPandaState(state){
  // state = 'idle' | 'listening' | 'thinking' | 'speaking'
  var avatar = document.getElementById('pandaAvatar');
  var icon = document.getElementById('stateIcon');
  var viz = document.getElementById('visualizer');
  if(!avatar || !icon) return;
  
  avatar.className = 'panda-avatar state-' + state;
  
  // আইকন
  var icons = {
    'idle': '💤',
    'listening': '👂',
    'thinking': '💭',
    'speaking': '🔊'
  };
  icon.textContent = icons[state] || '💤';
  
  // স্ট্যাটাস পিল
  var statusText = document.getElementById('statusText');
  if(statusText){
    var labels = {
      'idle': 'বিশ্রামে',
      'listening': 'শুনছি',
      'thinking': 'ভাবছি',
      'speaking': 'বলছি'
    };
    statusText.textContent = labels[state] || 'অনলাইন';
  }
  
  // ভিজ্যুয়ালাইজার
  if(viz){
    if(state === 'speaking' || state === 'listening'){
      viz.classList.add('active');
    } else {
      viz.classList.remove('active');
    }
  }
}

/* ============================================================
   কল সিস্টেম
   ============================================================ */
var CALL = {
  active: false,
  timer: null,
  seconds: 0,
  micOn: false,
  speakerOn: true,
  isProcessing: false
};

function goHome(){
  if(CALL.active){
    var confirmed = confirm('কল চলছে। কল শেষ করবেন?');
    if(!confirmed) return;
    endCall();
  }
  document.getElementById('homeScreen').style.display = 'flex';
  document.getElementById('callScreen').style.display = 'none';
  document.getElementById('callControls').style.display = 'none';
  document.getElementById('backBtn').style.visibility = 'hidden';
}

function startCall(){
  CALL.active = true;
  CALL.seconds = 0;
  CALL.micOn = false;
  CALL.speakerOn = true;
  CALL.isProcessing = false;
  
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('callScreen').style.display = 'flex';
  document.getElementById('callControls').style.display = 'flex';
  document.getElementById('backBtn').style.visibility = 'visible';
  
  // টাইমার শুরু
  updateTimer();
  CALL.timer = setInterval(updateTimer, 1000);
  
  // পান্ডু শুভেচ্ছা জানাবে
  setPandaState('thinking');
  
  setTimeout(function(){
    // ভয়েস প্রস্তুতি — কিছু ব্রাউজারে প্রথম স্পিক কেটে যায়
    if('speechSynthesis' in window){
      var warmup = new SpeechSynthesisUtterance(' ');
      warmup.volume = 0;
      window.speechSynthesis.speak(warmup);
    }
    
    var greeting = 'হ্যালো! আমি পান্ডু। তোমার সাথে কথা বলে খুব ভালো লাগছে। কেমন আছো তুমি?';
    
    CHAT_HISTORY.push({ role: 'assistant', content: greeting });
    
    setPandaState('speaking');
    speakBangla(greeting, function(){
      setPandaState('idle');
    });
  }, 1000);
}

function updateTimer(){
  var m = Math.floor(CALL.seconds / 60);
  var s = CALL.seconds % 60;
  var el = document.getElementById('callTimer');
  if(el){
    el.textContent = pad(m) + ':' + pad(s);
  }
  CALL.seconds++;
}

function pad(n){
  // বাংলা সংখ্যা
  var bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  var s = String(n).padStart(2, '0');
  return s.split('').map(function(c){ return bnDigits[parseInt(c)] || c; }).join('');
}

function endCall(){
  CALL.active = false;
  if(CALL.timer){
    clearInterval(CALL.timer);
    CALL.timer = null;
  }
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }
  stopListening();
  setPandaState('idle');
  
  document.getElementById('homeScreen').style.display = 'flex';
  document.getElementById('callScreen').style.display = 'none';
  document.getElementById('callControls').style.display = 'none';
  document.getElementById('backBtn').style.visibility = 'hidden';
  
  // হিস্টরি সেভ
  saveHistory();
}

/* ============================================================
   মাইক — Voice Recognition
   ============================================================ */
var MIC = {
  recognition: null,
  isListening: false,
  finalTranscript: ''
};

function toggleMic(){
  if(MIC.isListening){
    stopListening();
  } else {
    startListening();
  }
}

function startListening(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    showToast('এই ব্রাউজারে ভয়েস সাপোর্ট নেই। Chrome ব্যবহার করুন।', 'error');
    return;
  }
  
  if(CALL.isProcessing){
    showToast('পান্ডু এখন ভাবছে, একটু অপেক্ষা করো', 'warning');
    return;
  }
  
  // পান্ডু কথা বলছে — আগে থামাও
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }
  
  MIC.isListening = true;
  MIC.finalTranscript = '';
  MIC.recognition = new SR();
  MIC.recognition.lang = 'bn-BD';
  MIC.recognition.continuous = false;
  MIC.recognition.interimResults = true;
  MIC.recognition.maxAlternatives = 1;
  
  var micBtn = document.getElementById('micBtn');
  if(micBtn) micBtn.classList.add('active');
  
  setPandaState('listening');
  
  MIC.recognition.onresult = function(ev){
    var interim = '';
    var final = '';
    for(var i = ev.resultIndex; i < ev.results.length; i++){
      var transcript = ev.results[i][0].transcript;
      if(ev.results[i].isFinal){
        final += transcript;
      } else {
        interim += transcript;
      }
    }
    MIC.finalTranscript = final || interim;
  };
  
  MIC.recognition.onerror = function(e){
    console.error('Mic error:', e.error);
    if(e.error === 'not-allowed'){
      showModal('🎤', 'মাইক্রোফোন দরকার', 'পান্ডুর সাথে কথা বলতে ব্রাউজারে মাইক্রোফোনের অনুমতি দিতে হবে।');
    } else if(e.error === 'no-speech'){
      showToast('কিছু শোনা যায়নি, আবার চেষ্টা করো', 'warning');
    }
    stopListening();
  };
  
  MIC.recognition.onend = function(){
    var text = MIC.finalTranscript.trim();
    stopListening();
    
    if(text && text.length > 0){
      handleUserSpeech(text);
    } else {
      setPandaState('idle');
      showToast('কিছু বলো, পান্ডু শুনছে 🐼', 'warning');
    }
  };
  
  try{
    MIC.recognition.start();
    showToast('🎤 বলো, পান্ডু শুনছে...', 'success');
  }catch(e){
    console.error(e);
    stopListening();
  }
}

function stopListening(){
  MIC.isListening = false;
  var micBtn = document.getElementById('micBtn');
  if(micBtn) micBtn.classList.remove('active');
  try{
    if(MIC.recognition) MIC.recognition.stop();
  }catch(e){}
}

/* ============================================================
   ব্যবহারকারীর কথা প্রসেস
   ============================================================ */
var CHAT_HISTORY = [];
var USER_KEY = 'pandu_user_v1';

function loadHistory(){
  try{
    var d = JSON.parse(localStorage.getItem(USER_KEY));
    if(d && Array.isArray(d)) return d;
  }catch(e){}
  return [];
}

function saveHistory(){
  try{
    // শেষ ২০টি মেসেজ রাখি
    var toSave = CHAT_HISTORY.slice(-20);
    localStorage.setItem(USER_KEY, JSON.stringify(toSave));
  }catch(e){}
}

// আগের কথোপকথন লোড করি
CHAT_HISTORY = loadHistory();

function handleUserSpeech(text){
  if(CALL.isProcessing) return;
  CALL.isProcessing = true;
  
  setPandaState('thinking');
  
  CHAT_HISTORY.push({ role: 'user', content: text });
  // হিস্টরি সীমিত
  if(CHAT_HISTORY.length > 16) CHAT_HISTORY = CHAT_HISTORY.slice(-16);
  
  callAI(CHAT_HISTORY).then(function(reply){
    if(!reply) reply = 'আচ্ছা, বলো তো আরেকবার?';
    
    CHAT_HISTORY.push({ role: 'assistant', content: reply });
    CALL.isProcessing = false;
    
    // পান্ডু উত্তর দেবে
    setPandaState('speaking');
    speakBangla(reply, function(){
      setPandaState('idle');
    });
  }).catch(function(err){
    console.error(err);
    CALL.isProcessing = false;
    var fallback = 'দুঃখিত, একটু সমস্যা হয়েছে। আবার বলবে?';
    setPandaState('speaking');
    speakBangla(fallback, function(){
      setPandaState('idle');
    });
  });
}

/* ============================================================
   Cloudflare Worker-এ AI কল
   ============================================================ */
function callAI(messages){
  var apiMessages = [{ role: 'system', content: PANDU_SYSTEM }].concat(messages);
  
  return fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: apiMessages })
  })
  .then(function(res){
    if(!res.ok){
      return res.text().then(function(txt){
        throw new Error('HTTP ' + res.status + ': ' + (txt.substring(0, 150) || 'Unknown'));
      });
    }
    return res.json();
  })
  .then(function(data){
    if(data && data.choices && data.choices[0] && data.choices[0].message){
      return data.choices[0].message.content.trim();
    }
    if(data && data.error){
      throw new Error(data.error.message || 'AI error');
    }
    throw new Error('উত্তর পাওয়া যায়নি');
  });
}

/* ============================================================
   স্পিকার (মিউট)
   ============================================================ */
function toggleSpeaker(){
  CALL.speakerOn = !CALL.speakerOn;
  var btn = document.getElementById('speakerBtn');
  var icon = document.getElementById('speakerIcon');
  
  if(CALL.speakerOn){
    btn.classList.remove('muted');
    icon.className = 'fas fa-volume-up';
    showToast('🔊 স্পিকার চালু', 'success');
  } else {
    btn.classList.add('muted');
    icon.className = 'fas fa-volume-mute';
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    showToast('🔇 স্পিকার বন্ধ', 'success');
  }
}

/* ============================================================
   Toast
   ============================================================ */
var TOAST_TIMER = null;
function showToast(msg, type){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast';
  if(type) t.classList.add(type);
  t.classList.add('show');
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(function(){
    t.classList.remove('show');
  }, 3000);
}

/* ============================================================
   Modal
   ============================================================ */
function showModal(icon, title, text){
  document.getElementById('modalIcon').textContent = icon;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}
